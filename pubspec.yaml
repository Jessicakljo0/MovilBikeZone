name: movilbikezone
description: Aplicación BikeZone con mapas, estaciones, rutas y reservaciones.
publish_to: "none"

version: 1.4.0+5

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.1
  latlong2: ^0.9.1
  shared_preferences: ^2.5.5
  geolocator: ^14.0.3
  http: ^1.6.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.2.0
  google_maps_flutter: ^2.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/